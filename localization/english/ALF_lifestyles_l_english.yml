 game_concept_willmagic_lifestyle_desc: "$willmagic_lifestyle_desc$"

 GAINS_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "Gains $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
