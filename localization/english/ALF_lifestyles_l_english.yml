l_english:
 willmagic_lifestyle_name: "Will Magic"
 willmagic_lifestyle_desc: "Imprint your will into the world"

 game_concept_willmagic_lifestyle: "$willmagic_lifestyle_name$"
 game_concept_willmagic_lifestyle_desc: "$willmagic_lifestyle_desc$"

 GAINS_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "Gains $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
 GAINED_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "Gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
 I_GAIN_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "You gain $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
 I_GAINED_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "You gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
 TARGET_GAINS_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] gains $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"
 TARGET_GAINED_WILLMAGIC_LIFESTYLE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] Experience"

 GAINS_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "Gains $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"
 GAINED_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "Gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"
 I_GAIN_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "You gain $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"
 I_GAINED_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "You gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"
 TARGET_GAINS_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] gains $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"
 TARGET_GAINED_A_WILLMAGIC_LIFESTYLE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] gained $VALUE|V0$ [willmagic_lifestyle_lifestyle|E] [perk|E] Unlock"

 REPEATABLE_PERK_EFFECT: "This [perk|E] can be repeated as many times as [perk|E] name says"

 willmagic_focus: "$willmagic_lifestyle_name$"
 willmagic_focus_desc: "$willmagic_lifestyle_desc$"
 willmagic_focus_effect_desc: "Focusing on $willmagic_lifestyle_name$ grants:"

 general_spell_loca: "As [ALF_spell|E],"

 ################## Voluntas ##################
 voluntas_name: "Voluntas"

 inspect_will_perk_name: "Inscept Will"
 INSPECT_WILL_PERK_EFFECT: "$general_spell_loca$ discover [ALF_mental_fortitude|E] of target.\n#flavor Mage can sense [ALF_mental_fortitude|E] of other people with expensure of [ALF_willpower|E].#!"
 train_will_perk_name: "Train Will"
 TRAIN_WILL_PERK_EFFECT: "#flavor Mage can meditate with hopes of strenghening their [ALF_mental_fortitude|E].#!"
 command_will_perk_name: "Command Will"
 COMMAND_WILL_PERK_EFFECT: "#flavor Mage can manipulate [ALF_willpower|E] much easier than before.#!"
 extend_will_perk_name: "Extend Will"
 EXTEND_WILL_PERK_EFFECT: "#flavor Mage can extend their own [ALF_willpower|E] beyond what was possible before.#!"
 hide_will_perk_name: "Hide Will"
 HIDE_WILL_PERK_EFFECT: "Become Immune to [GetPerk('inspect_will_perk').GetName(GetPlayer)].\n#flavor Mage can hide their [ALF_mental_fortitude|E] from spying eyes.#!"
 regenerate_will_perk_name: "Regenerate Will"
 REGENERATE_WILL_PERK_EFFECT: "Every #V 10#! years, gain 1 [ALF_mental_fortitude|E].\n#flavor Mage can create infinite loop which generates free [ALF_willpower|E] over time.#!"
 defend_will_perk_name: "Defend Will"
 DEFEND_WILL_PERK_EFFECT: "#flavor Mage's defensive abilites against hostile will are much stronger.#!"
 attack_will_perk_name: "Attack Will"
 ATTACK_WILL_PERK_EFFECT: "#flavor Mage's aggresive abilites against hostile will are much stronger.#!"
 steal_will_perk_name: "Steal Will"
 STEAL_WILL_PERK_EFFECT: "$general_spell_loca$ Steal 1 [ALF_mental_fortitude|E] from [imprisoned|E] target at cost of 100 [ALF_willpower|E].\n#flavor Mage can steal [ALF_mental_fortitude|E] of other beings although at great cost to both of sides.#!"
 conquer_will_perk_name: "Conquer Will"
 CONQUER_WILL_PERK_EFFECT: "Decrease cost of [GetPerk('steal_will_perk').GetName(GetPlayer)] from #N 100#! [ALF_willpower|E] to #P 50#! [ALF_willpower|E].\n#flavor Mage can steal [ALF_mental_fortitude|E] from others with greater ease than before, limiting cost on their side.#!"

 counter_will_perk_name: "Counter Will ([ROOT.Char.MakeScope.ScriptValue('counter_will_perk_count_tt')]/∞)"
 COUNTER_WILL_PERK_EFFECT: "#flavor Mage counter incoming hostile will with greater ease#!"
 counter_will_modifier: "Counter Will"
 ALF_counter_will_perk_count_desc: "Per #V $counter_will_modifier$#! level"

 enforce_will_perk_name: "Enforce Will ([ROOT.Char.MakeScope.ScriptValue('enforce_will_perk_count_tt')]/∞)"
 ENFORCE_WILL_PERK_EFFECT: "#flavor Mage enforce their demands to world with greater ease.#!"
 enforce_will_modifier: "Enforce Will"
 ALF_enforce_will_perk_count_desc: "Per #V $enforce_will_modifier$#! level"
 
 strenghen_will_perk_name: "Strenghen Will ([ROOT.Char.MakeScope.ScriptValue('strenghen_will_perk_count_tt')]/7)"
 STRENGHEN_WILL_PERK_EFFECT: "#flavor Mage can strenghen their own [ALF_mental_fortitude|E] using pure determination.#!"
 strenghen_will_modifier: "Strenghen Will"
 ALF_strenghen_will_perk_count_desc: "Per #V $strenghen_will_modifier$#! level"
 
 ################## Animalium ##################
 animalium_name: "Animalium"

 influence_animals_perk_name: "Influence Animals"
 INFLUENCE_ANIMALS_PERK_EFFECT: "$general_spell_loca$ Spawn random animal as pet.\n#flavor Mage can subtly influence animals nearby.#!"

 control_animals_perk_name: "Control Animals"
 CONTROL_ANIMALS_PERK_EFFECT: "Unlock [GetMaA('ALF_wolves').GetName], [GetMaA('ALF_birds').GetName] and [GetMaA('ALF_rats').GetName] as [men_at_arms|E].\n#flavor Mage can take control over nearby animals.#!"

 resurrect_animals_perk_name: "Resurrect Pets"
 RESURRECT_ANIMALS_PERK_EFFECT: "Your pets won't be able to die anymore.\n#flavor Mage can simply not allow their pets to die.#!"
 ferocious_animals_perk_name: "Ferocious Animals"
 FEROCIOUS_ANIMALS_PERK_EFFECT: "#flavor Mage can make previously 'pacifist' animals into war machines.#!"
 calm_animals_perk_name: "Calm Animals"
 CALM_ANIMALS_PERK_EFFECT: "$general_spell_loca$ Spawn hunting oportunity.\n#flavor Mage can calm animals nearby.#!"

 durrable_animals_perk_name: "Durrable Animals"
 DURRABLE_ANIMALS_PERK_EFFECT: "#flavor Mage can make animals under their control more durrable than their natural counterpart#!"

 create_animals_perk_name: "Create Animals"
 CREATE_ANIMALS_PERK_EFFECT: "#flavor Mage can create completely new animals from thin air, as long they know what that animal looks in nature.#!"

 create_mythical_animals_perk_name: "Create Mythical Animals"
 CREATE_MYTHICAL_ANIMALS_PERK_EFFECT: "Unlock [GetMaA('ALF_pegasus').GetName]and [GetMaA('ALF_unicorn').GetName] as [men_at_arms|E].\n#flavor Mage can create completely new animals from thin air, no matter what 'nature' says.#!"

 supernatural_animals_perk_name: "Supernatural Animals"
 SUPERNATURAL_ANIMALS_PERK_EFFECT: "#flavor Mage can make animals under their control obviously supernatural.#!"

 strong_animals_perk_name: "Strong Animals ([ROOT.Char.MakeScope.ScriptValue('strong_animals_perk_count_tt')]/∞)"
 STRONG_ANIMALS_PERK_EFFECT: "#flavor Mage can Strenghen animals under their control.#!"
 strong_animals_modifier: "Strong Animals"
 ALF_strong_animals_perk_count_desc: "Per #V $strong_animals_modifier$#! level"

 cheap_animals_perk_name: "Cheap Animals ([ROOT.Char.MakeScope.ScriptValue('cheap_animals_perk_count_tt')]/15)"
 CHEAP_ANIMALS_PERK_EFFECT: "#flavor Mage can create animals much easier than before.#!"
 cheap_animals_modifier: "Cheap Animals"
 ALF_cheap_animals_perk_count_desc: "Per #V $cheap_animals_modifier$#! level"