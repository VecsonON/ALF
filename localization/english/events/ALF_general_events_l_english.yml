l_english: 
 ALF_events.1.t: "Mental Break: Moving Cup?"
 ALF_events.1.desc: "Lately, I've felt a growing surge of anger rising within me. Just today, as I was about to hurl the cup I was drinking from against the wall, it flew from my hand on its own-shattering without me lifting a finger. As I stood there, stunned, I felt something shift. It was as if the entire world around me changed in response to my rage."
 ALF_events.1.a: "Am I going insane?"
 ALF_events.1.a.a: "No, I will study it further"
 ALF_events.1.a.b: "I think? After all, for some time already I do see that flying pig..."