l_english: 
 ALF_events.0001.t: "[ALF_mod|E]!"
 ALF_events.0001.desc: "Welcome to the 4th Iteration of Arcane Legacy!\nFor new players: #italic Arcane Legacy#! is a series of mods designed to bring magic into the grounded world of #bold #!Crusader Kings III#!, all developed by #bold VecsonON#!.\n\nIn this fourth iteration, I've chosen to return to the roots of #italic Arcane Legacy#!-focusing on a streamlined lifestyle tree rather than an overly complex GUI. While earlier versions like AL1 and AL2 were limited in scope due to their rigid lore, this version has been built from the ground up with expandability in mind, aiming to greatly increase the mod's lifespan.\n\nThanks to my expanded experience with CK3 modding-both from the previous #italic Arcane Legacy#! mods and my time as a developer for #italic Princes of Darkness#!-this iteration features a more robust and flexible framework, making it easier than ever to build upon and maintain.\n\nBecoming a [GetTrait('ALF_mage').GetName(GetPlayer)] in this mod is quite simple, either convince already existing mage to teach you, or randomly become one after [mental_break|E]"
 ALF_events.0001.a: "Let's start"

 ALF_events.1000.t: "Greatest Spell: Am I sure?"
 ALF_events.1000.desc: "Immortality is the ultimate aspiration of every [ALF_mage|E]. Anyone can level castles or bring Armageddon to an [empire|E]-but immortality remains elusive. The idea of forcing the [ALF_first_will|E] into slumber, even for a moment, to cast the [ALF_spell|E] that would grant me eternal life is undeniably tempting. Yet the danger is immense. One misstep, and all of reality could collapse. Am I truly willing to risk everything for a chance to live forever?"
 ALF_events.1000.a: "Yes, I would."
 ALF_events.1000.b: "Eh, I have to rethink something."
 ALF_greatest_spell_objective_decision_mental_fortitude_more_dificult: "#X Every time you use your [ALF_willpower|E] in Greatest Spell, next time you will use [ALF_willpower|E] to solve problems will be #bold require more [ALF_mental_fortitude|E]#!.#!"
 ALF_greatest_spell_increase_success_chance: "#P Increase Success chance of Greatest Spell by #bold 10%#!.#!"

 ALF_events.1001.t: "Greatest Spell: What are my sources?"
 ALF_events.1001.desc: "Before I begin preparations for the Greatest Spell, I must ask myself a simple question: how certain am I that it's even possible to forse the [ALF_first_will|E] into slumber-long enough to complete my [ALF_spell|E], yet brief enough to avoid unraveling all of reality in the process? And am I sure [ALF_first_will|E] won't just undo my immortality after waking up?"
 ALF_events.1001.a: "With my [ALF_willpower|E] anything is possible!"
 ALF_events.1001.a.tt: "You don't have enough [ALF_mental_fortitude|E]!"
 ALF_events.1001.b: "I do know something about immortal people."
 ALF_events.1001.b.tt: "You infact, don't know something about immortal people. #weak You need above #V 20#! [learning|E] or have any [relation|E] with [GetTrait('immortal').GetName(GetPlayer)]#!"
 ALF_events.1001.c: "Rumors will sufice."

 ALF_events.1002.t: "Greatest Spell: How?"
 ALF_events.1002.desc: "The 'why' is clear-I seek immortality. My sources? Known, though their reliability remains uncertain. But now, a new question stands before me: how?\n\nHow will I force the [ALF_first_will|E] into slumber?\n\nHow will I make myself immortal?\n\nHow will I ensure that everything unfolds perfectly, without error or catastrophe?"
 ALF_events.1002.a: "By my [ALF_willpower|E] of course!"
 ALF_events.1002.b: "I am archmage for god's sake!"
 ALF_events.1002.b.tt: "You are not an archmage. #weak You need to master at least 3 [ALF_willmagic_paths|E]#!"
 ALF_events.1002.c: "I will be fine."

 ALF_events.1003.t: "Greatest Spell: Not Only One"
 ALF_events.1003.desc: "Somehow, knowledge of my research into the Greatest Spell has leaked. And it seems I'm not the only one aware of the danger it poses. Now, I find myself under siege—an entire small army of [ALF_mages|E] has come to stop what they see as a foolish and catastrophic plan.\n\nSo the question becomes: how do I deal with them?"
 ALF_events.1003.a: "I will impress them with my [ALF_mental_fortitude|E]!"
 ALF_events.1003.b: "Attack is the answer!"
 ALF_events.1003.b.tt: "You are too weak in [martial|E] or [prowess|E] #weak You need at least #V 20#! [martial|E] or #V 60#! [prowess|E]#!"
 ALF_events.1003.c: "Eh? Time to hide?"

 ALF_events.1004.t: "Greatest Spelll: Last Preparations"
 ALF_events.1004.desc: "Everything is in its place. I am nearly certain this will succeed. All that remains are the final adjustments-small tweaks and quiet preparations-before the grand finale begins."
 ALF_events.1004.a: "I #bold WILL#! succeed!"
 ALF_events.1004.b: "Throw [gold|E] at the problem!"
 ALF_events.1004.c: "Great! I was getting impatient!"

 ALF_events.1005.t: "Greatest Spell: Grand Finale"
 ALF_events.1005.desc: "And here I am-everything is in place. There is no turning back now. From this point forward, only three outcomes remain: I succeed… I fail, but reality endures… or I become the one who unravels all of existence.\n\nWhat happens next is the only thing on my mind."
 ALF_events.1005.a: "Here it go"
 ALF_events.1005.a.a.tt: "Immortality at last"
 ALF_events.1005.a.b.tt: "At least, reality stil stands?"
 ALF_events.1005.a.c.tt: "#DIE1 NOno#DIE2 no-#!#!"
 ALF_events.1005.a.c.effect: "#X Congratulations! You destroyed reality...#!"
 ALF_events.1005.b: "NO! Wait, What #bold AM#! I doing!?"

 ALF_events.9001.t: "Mental Break: Moving Cup?"
 ALF_events.9001.desc: "Lately, I've felt a growing surge of anger rising within me. Just today, as I was about to hurl the cup I was drinking from against the wall, it flew from my hand on its own-shattering without me lifting a finger. As I stood there, stunned, I felt something shift. It was as if the entire world around me changed in response to my rage."
 ALF_events.9001.a: "Am I going insane?"
 ALF_events.9001.a.a: "No, I will study it further"
 ALF_events.9001.a.b: "I think? After all, for some time already I do see that flying pig..."