l_english:
 fortuna_name: "Fortuna"

 lucky_existence_perk_name: "Lucky Existence"
 share_luck_perk_name: "Share Luck"
 steal_luck_perk_name: "Steal Luck"
 greater_luck_perk_name: "Greater Luck"
 oops_perk_name: "Oops!"
 bless_character_perk_name: "Bless Character"
 bless_artifact_perk_name: "Bless Artifact"
 bless_land_perk_name: "Bless Land"
 curse_perk_name: "Curse"
 tragic_day_perk_name: "Tragic Day"
 lucky_day_perk_name: "Lucky Day ([ROOT.Char.MakeScope.ScriptValue('lucky_day_perk_count_tt')]/∞)"

 LUCKY_EXISTENCE_PERK_EFFECT: "#flavor Mage subconsiously makes their day to day life more 'lucky'.#!"
 SHARE_LUCK_PERK_EFFECT: "$general_spell_loca$ Give target#weak (not you)#! [GetModifier('additional_luck_modifier').GetNameWithTooltip] for 5 years.\n#flavor Mage can share portion of their luck with others.#!"
 STEAL_LUCK_PERK_EFFECT: "$general_spell_loca$ Give target#weak (not you)#! [GetModifier('stolen_luck_modifier').GetNameWithTooltip] for 5 years and give you [GetModifier('additional_luck_modifier').GetNameWithTooltip] for 5 years.\n#flavor Mage can steal luck of others.#!"
 GREATER_LUCK_PERK_EFFECT: "#flavor Mage can will into reality concept of 'luck'.#!"
 OOPS_PERK_EFFECT: "$general_spell_loca$ Damage Target Artifact.\n#flavor Mage can cause an accident that will resoult in damage to [artifact|E].#!"
 BLESS_CHARACTER_PERK_EFFECT: "$general_spell_loca$ Give target character [GetModifier('bless_character_modifier').GetNameWithTooltip] for 5 years.\n#flavor Mage can bestow blessing onto living being.#!"
 BLESS_ARTIFACT_PERK_EFFECT: "$general_spell_loca$ Give target artifact [GetModifier('bless_artifact_modifier').GetNameWithTooltip].\n#flavor Mage can bestow blessing onto an object.#!"
 BLESS_LAND_PERK_EFFECT: "$general_spell_loca$ Give target title [GetModifier('bless_land_modifier').GetNameWithTooltip] for 5 years.\n#flavor Mage can bestow blessing onto a piece of land.#!"
 CURSE_PERK_EFFECT: "$general_spell_loca$ Give target oposite [modifier|E] of 'bless' [perks|E].\n#flavor Mage can bestow curse upon target.#!"
 TRAGIC_DAY_PERK_EFFECT: "$general_spell_loca$ Cause accident for target, with chance of killing them.\n#flavor Mage can make someone life miserable for a day.#!"
 LUCKY_DAY_PERK_EFFECT: "#flavor Mage's luck grows as much a needed.#!"