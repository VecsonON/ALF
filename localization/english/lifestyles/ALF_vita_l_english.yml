l_english:
 vita_name: "Vita"

 sense_life_perk_name: "Sense Life"
 understand_life_perk_name: "Understand Life"
 influence_life_perk_name: "Influence Life"
 close_wound_perk_name: "Close Wound"
 heal_illness_perk_name: "Heal Illness"
 amend_flesh_perk_name: "Amend Flesh"
 inflict_wounds_perk_name: "Inflict Wounds"
 inflict_illness_perk_name: "Inflict Illness"
 remove_flesh_perk_name: "Remove Flesh"
 improve_flesh_perk_name: "Improve Flesh"
 long_life_perk_name: "Long Life ([ROOT.Char.MakeScope.ScriptValue('long_life_perk_count_tt')]/∞)"

 SENSE_LIFE_PERK_EFFECT: "#flavor Mage can sense nearby life.#!"
 UNDERSTAND_LIFE_PERK_EFFECT: "#flavor Mage understanding of life is great, due to fact they change what life is nearby.#!"
 INFLUENCE_LIFE_PERK_EFFECT: "#flavor Mage can subtly influence life nearby.#!"
 CLOSE_WOUND_PERK_EFFECT: "$general_spell_loca$ Reduce Wounded [trait|E] level by #P 1#!.\n#flavor Mage can force wounds to close.#!"
 HEAL_ILLNESS_PERK_EFFECT: "$general_spell_loca$ Heal random illnes [trait|E] target has.\n#flavor Mage can kill any illness they know of.#!"
 AMEND_FLESH_PERK_EFFECT: "$general_spell_loca$ Remove random permanent disfigurement [trait|E], like [GetTrait('maimed').GetName(GetPlayer)] or [GetTrait('one_eyed').GetName(GetPlayer)].\n#flavor Mage can amend any permanent disfigurement.#!"
 INFLICT_WOUNDS_PERK_EFFECT: "$general_spell_loca$, Inflict Wounded [trait|E] onto target.\n#flavor Mage can will into existence the fact that their target is wounded.#!"
 INFLICT_ILLNESS_PERK_EFFECT: "$general_spell_loca$ Inflict random Illness onto target.\n$general_spell_loca$ Inflict [epidemic|E] onto target.\n#flavor Mage can will into existence the fact that their target is ill.#!"
 REMOVE_FLESH_PERK_EFFECT: "$general_spell_loca$ Give random permanent disfigurement [trait|E], like [GetTrait('maimed').GetName(GetPlayer)] or [GetTrait('one_eyed').GetName(GetPlayer)].\n#flavor Mage can will limb out of existence.#!"
 IMPROVE_FLESH_PERK_EFFECT: "$general_spell_loca$, Increase random genetic [trait|E] level by #P 1#!.\n#flavor Mage can improve genetic structure of human body, though they don't use word 'genetic'.#!"
 LONG_LIFE_PERK_EFFECT: "Every time you get this [perk|E], cost of this [perk|E] doubles.\n#flavor Mage can extend their lifespan, though process isn't perfect.#!"
 LONG_LIFE_PERK_COST_EFFECT: "#clickable This [perk|E] will cost $VALUE|0$ [perk|E] points!#!"