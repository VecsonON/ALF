 INSPECT_WILL_PERK_EFFECT: "$general_spell_loca$ discover [ALF_mental_fortitude|E] of target.\n#flavor [ALF_mage|E] can sense [ALF_mental_fortitude|E] of other people with expensure of [ALF_willpower|E].#!"
 TRAIN_WILL_PERK_EFFECT: "#flavor [ALF_mage|E] can meditate with hopes of strenghening their [ALF_mental_fortitude|E].#!"
