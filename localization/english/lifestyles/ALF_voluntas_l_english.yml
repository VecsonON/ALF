 STEAL_WILL_PERK_EFFECT: "$general_spell_loca$ Steal 1 [ALF_mental_fortitude|E] from [imprisoned|E] target at cost of 100 [ALF_willpower|E].\n#flavor [ALF_mage|E] can steal [ALF_mental_fortitude|E] of other beings although at great cost to both of sides.#!"
 CONQUER_WILL_PERK_EFFECT: "Decrease cost of [GetPerk('steal_will_perk').GetName(GetPlayer)] from #N 100#! [ALF_willpower|E] to #P 50#! [ALF_willpower|E].\n#flavor [ALF_mage|E] can steal [ALF_mental_fortitude|E] from others with greater ease than before, limiting cost on their side.#!"
 COUNTER_WILL_PERK_EFFECT: "#flavor [ALF_mage|E] counter incoming hostile will with greater ease#!"
 ENFORCE_WILL_PERK_EFFECT: "#flavor [ALF_mage|E] enforce their demands to world with greater ease.#!"
 STRENGHEN_WILL_PERK_EFFECT: "#flavor [ALF_mage|E] can strenghen their own [ALF_mental_fortitude|E] using pure determination.#!"