 EXTEND_WILL_PERK_EFFECT: "#flavor [ALF_mage|E] can extend their own [ALF_willpower|E] beyond what was possible before.#!"
 HIDE_WILL_PERK_EFFECT: "Become Immune to [GetPerk('inspect_will_perk').GetName(GetPlayer)].\n#flavor [ALF_mage|E] can hide their [ALF_mental_fortitude|E] from spying eyes.#!"
 REGENERATE_WILL_PERK_EFFECT: "Every #V 10#! years, gain 1 [ALF_mental_fortitude|E].\n#flavor [ALF_mage|E] can create infinite loop which generates free [ALF_willpower|E] over time.#!"
 DEFEND_WILL_PERK_EFFECT: "#flavor [ALF_mage|E]'s defensive abilites against hostile will are much stronger.#!"
